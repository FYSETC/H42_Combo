################################################################################################### SB CAN
[mcu h42]
# serial: /dev/serial/by-id/usb-Klipper_stm32g431xx_69004D000550334357353420-if00
# Follow the instruction here https://www.klipper3d.org/CANBUS.html to get CAN id
canbus_uuid=516e85798274
canbus_interface: can0

[extruder]
step_pin: h42:PB4
dir_pin: !h42:PB3
enable_pin: !h42:PB9

##  Update value below when you perform extruder calibration
##  If you ask for 100mm of filament, but in reality it is 98mm:
##  rotation_distance = <previous_rotation_distance> * <actual_extrude_distance> / 100
##  22.6789511 is a good starting point for Bondtech 5mm gears
##  34.37086 for Bondtech 8mm gears (Galileo)
rotation_distance: 22#22.6789511   #Bondtech 5mm Drive Gears
##  Update Gear Ratio depending on your Extruder Type
##  Use 50:17 for Afterburner/Clockwork (BMG Gear Ratio)
##  Use 80:20 for M4, M3.1
##  Use 7.5:1 for Galileo
gear_ratio: 50:10               #BMG Gear Ratio
microsteps: 16
full_steps_per_rotation: 200    #200 for 1.8 degree, 400 for 0.9 degree
nozzle_diameter: 0.400
filament_diameter: 1.75
heater_pin: h42:PC15 # Heat
## Check what thermistor type you have. See https://www.klipper3d.org/Config_Reference.html#common-thermistors for common thermistor types.
## Use "Generic 3950" for NTC 100k 3950 thermistors
sensor_type: Generic 3950
pullup_resistor:2200
#   The resistance (in ohms) of the pullup attached to the thermistor.
#   The default is 4700 ohms.
#inline_resistor: 0
sensor_pin: h42:PB0
min_temp: -273.15
max_temp: 300
max_power: 1.0
min_extrude_temp: 170
control = pid
pid_kp = 14.950
pid_ki = 0.785
pid_kd = 71.202
#pid_kp = 26.213
#pid_ki = 1.304
#pid_kd = 131.721
##  Try to keep pressure_advance below 1.0
# pressure_advance: 0.01
# pressure_advance_smooth_time: 0.040
# max_extrude_cross_section: 50.0


[tmc2209 extruder]
uart_pin: h42:PA10
interpolate: false
run_current: 0.7
sense_resistor: 0.110
stealthchop_threshold: 0
##diag_pin: h42:PB5
	
[neopixel led_h42]
pin: h42:PA14
chain_count: 1
color_order: GRBW
initial_RED: 0
initial_GREEN: 0.5
initial_BLUE: 0
initial_WHITE: 0

[fan_generic exfan0]
pin: h42:PB2 #FAN2
max_power:1.0
off_below:0
tachometer_pin:h42:PB11

[fan_generic exfan1]
pin: h42:PB10 #FAN2
max_power:1.0
off_below:0
tachometer_pin:h42:PB14

[fan_generic exfan2]
pin: h42:PB13 #FAN2
max_power:1.0
off_below:0

[temperature_sensor driver_Temp]
sensor_type: Generic 3950
sensor_pin: h42:PB12
min_temp:0
max_temp:150
pullup_resistor: 4700

[adxl345]
cs_pin: h42:PA0
spi_software_sclk_pin: h42:PA5
spi_software_mosi_pin: h42:PA7
spi_software_miso_pin: h42:PA6
axes_map: -y,z,-x

[resonance_tester]
accel_chip: adxl345
probe_points:
    300,300,30 # an example

